- name: Overhaul Shipment API
  description: >-
    Create and manage shipments and receive status-based data updates, including risk summaries, driver details and
    next-delivery insights. Marketed as part of Overhaul's tiered API subscription. No public reference documentation
    is published; access is provisioned to Overhaul customers.
