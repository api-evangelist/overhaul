aid: overhaul
name: Overhaul
description: >-
  Overhaul is an Austin, Texas based supply-chain visibility, integrity and risk-management platform founded in 2016
  that monitors and protects in-transit cargo for global enterprises across pharmaceuticals and life sciences,
  consumer electronics, AI hardware, automotive, manufacturing, retail and food and beverage. The platform combines
  data-agnostic multi-modal tracking (customer-owned or Overhaul-supplied IoT loggers, tags and sensors), real-time
  risk scoring, cold-chain and compliance monitoring, and a 24/7 global risk operations response capability. Product
  surfaces include Shipment Manager, Shipment Connect and Shipment Connect Go, Risk Monitor, FraudWatch carrier and
  driver verification, PartView, VINView, InventoryView, DamageView, Asset Manager, SecureBOL and RiskGPT. Overhaul
  markets a family of transportation and logistics APIs — Shipment, Device, Risk Event, ETA, and FraudWatch carrier
  performance and risk scoring — sold as a tiered subscription plus standalone offerings, but publishes no public
  developer portal, OpenAPI definition or self-serve API documentation; API access is provisioned to customers.
