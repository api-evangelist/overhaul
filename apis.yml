- name: Overhaul Device API
  description: >-
    Real-time tracking across modes and regions using customer-owned IoT devices, loggers, tags and sensors or
    Overhaul's recommended hardware, returning device status, location and associated shipment detail. Part of
    Overhaul's tiered API subscription; no public reference documentation is published.
  humanURL: https://www.over-haul.com/blog/transportation-logistics-apis
